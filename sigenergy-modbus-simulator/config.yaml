name: "Sigenergy Modbus Simulator"
description: >-
  Modbus TCP and Cloud API simulator for SigenStor/Sigenergy inverters.
  Runs the modbus_test_server from the sigenergy2mqtt project on port 502,
  allowing testing of sigenergy2mqtt without a physical inverter.
  Also runs a cloud API simulator on port 8080, allowing testing of the
  sigenergy2mqtt cloud API integration.
image: "ghcr.io/seud0nym/home-assistant-app-sigenergy-modbus-simulator"
version: "2026.10.13"
slug: "sigenergy-modbus-simulator"
url: "https://github.com/seud0nym/home-assistant-addons/tree/test/sigenergy-modbus-simulator"
init: false

arch:
  - aarch64
  - amd64

host_network: true
ports:
  502/tcp: 502
  8080/tcp: 8080
ports_description:
  502/tcp: "Modbus TCP (simulator)"
  8080/tcp: "Cloud API (simulator)"

options:
  log_level: "INFO"
  simulate_grid_outages: false
  simulate_firmware_upgrade: false
  simulate_power_factor_errors: false
  use_simplified_topics: false
  mqtt_broker: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_log_level: "WARNING"
  modbus_host: ""
  modbus_port: 502
  cloud_port: 8080
  cloud_username: "cloud_api_user"
  cloud_password: "drowssap_ipa_duolc"
  simulate_internet_outage: false

schema:
  log_level: "list(DEBUG|INFO|WARNING|ERROR|CRITICAL|Default)"
  initial_firmware: "str?"
  upgrade_firmware: "str?"
  protocol_version: "float(1.8,)?"
  registers_to_debug: "str?"
  simulate_grid_outages: "bool"
  simulate_firmware_upgrade: "bool"
  simulate_power_factor_errors: "bool"
  use_simplified_topics: "bool"
  mqtt_broker: "str?"
  mqtt_port: "port?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  mqtt_log_level: "list(DEBUG|INFO|WARNING|ERROR|CRITICAL|Default)?"
  modbus_host: "str?"
  modbus_port: "port?"
  cloud_port: "port?"
  cloud_username: "str?"
  cloud_password: "password?"
  simulate_internet_outage: "bool"