configuration:
  auto_discovery:
    name: Sigenergy 设备自动发现
    description: 自动发现您的 Sigenergy 设备的配置
    fields:
      status:
        name: 状态
        description: 控制 Sigenergy Modbus 主机及相关设备 ID 的自动发现。仅当您之前已自动发现主机/设备 ID，且网络或设备发生了更改时，才需要选择 `Forced`。
      max_device_id:
        name: 最大设备 ID
        description: 在网络上自动发现 Sigenergy 设备时使用的最大设备 ID。默认值为 `10`，且必须在 1 到 246 之间（含端点）。此选项可显著加快自动发现速度，但存在找不到设备 ID 高于此设置所允许最大值的设备的风险。
      ping_timeout:
        name: Ping 超时
        description: 自动发现时的 Ping 超时（秒）。默认 0.5 秒。
      retries:
        name: 最大重试次数
        description: 自动发现时的最大重试次数。默认为 0。
      timeout:
        name: Modbus 超时
        description: 自动发现时的 Modbus 超时（秒）。默认 0.25 秒。
  manual_config:
    name: Sigenergy 设备手动配置
    description: 手动指定连接详细信息的配置
    fields:
      host:
        name: 主机地址
        description: Sigenergy 设备的主机名或 IP 地址。留空以进行自动发现。
      port:
        name: Modbus 端口
        description: Sigenergy 设备的 Modbus 端口号。
      inverter_device_id:
        name: 逆变器设备 ID
        description: Sigenergy 逆变器 Modbus 设备 ID。如果有多个逆变器，可以指定以空格分隔的 ID 列表。未指定 Modbus 主机时将被忽略，此时自动发现可以识别逆变器设备。
      accharger_device_id:
        name: AC 充电器设备 ID
        description: Sigenergy AC 充电器 Modbus 设备 ID。未指定 Modbus 主机时将被忽略，此时自动发现可以识别 AC 充电器设备。
      dccharger_device_id:
        name: DC 充电器设备 ID
        description: Sigenergy DC 充电器 Modbus 设备 ID（通常与逆变器设备 ID 相同）。未指定 Modbus 主机时将被忽略，此时自动发现可以识别 DC 充电器设备。
  scan_interval:
    name: 传感器扫描间隔
    description: 不同传感器类别的扫描间隔配置
    fields:
      low:
        name: 低频率
        description: 低频率传感器的扫描间隔（秒）。默认 600，最小值 1。
      medium:
        name: 中频率
        description: 中频率传感器的扫描间隔（秒）。默认 60，最小值 1。
      high:
        name: 高频率
        description: 高频率传感器的扫描间隔（秒）。默认 10，最小值 1。
      realtime:
        name: 近实时
        description: 实时传感器的扫描间隔（秒）。默认 5，最小值 1。
      cloud:
        name: 云端频率
        description: 获取云端数据的扫描间隔（秒）。默认 5，最小值 1。
  pvoutput:
    name: PVOutput.org 集成
    description: 用于与 PVOutput.org 集成以上传发电量和消费量数据的配置
    fields:
      enabled:
        name: 启用上传
        description: 启用向 PVOutput 发送状态更新。
      api_key:
        name: API 密钥
        description: PVOutput 的 API 密钥
      system_id:
        name: 系统 ID
        description: PVOutput 系统 ID
      consumption:
        name: 启用消费量上传
        description: 向 PVOutput 发送消费状态。
      exports:
        name: 启用导出上传
        description: 向 PVOutput 发送导出数据。
      imports:
        name: 启用导入上传
        description: 向 PVOutput 发送导入数据。
      eod_update:
        name: 启用日终上传
        description: 启用后，峰值发电量以及导出和导入（如已启用）的每日总计将在一天结束时发送到 PVOutput。禁用后，这些值将按与状态更新相同的时间表上传。
      voltage:
        name: 电压源
        description: 发送到 PVOutput 的电压值来源。单相系统使用 'Phase A'，三相系统使用 'Phase B'、'Phase C' 或 'Line to Line Average'，两者均可使用 'Line to Neutral Average' 或 'PV Average'。
      ext_v7:
        name: 扩展数据 v7
        description: 用于填充 PVOutput 中 v7 扩展字段的数据源。您可以指定传感器类名、不带 'sensor.' 前缀的实体 ID、直接 MQTT 主题（或 mqtt:<topic>）或 Home Assistant 传感器实体 ID（sensor.<id> 或 ha:sensor.<id>）。如果未指定或您的捐赠状态不是最新的,此字段将不会发送到 PVOutput。
      ext_v8:
        name: 扩展数据 v8
        description: 用于填充 PVOutput 中 v8 扩展字段的数据源。您可以指定传感器类名、不带 'sensor.' 前缀的实体 ID、直接 MQTT 主题（或 mqtt:<topic>）或 Home Assistant 传感器实体 ID（sensor.<id> 或 ha:sensor.<id>）。如果未指定或您的捐赠状态不是最新的,此字段将不会发送到 PVOutput。
      ext_v9:
        name: 扩展数据 v9
        description: 用于填充 PVOutput 中 v9 扩展字段的数据源。您可以指定传感器类名、不带 'sensor.' 前缀的实体 ID、直接 MQTT 主题（或 mqtt:<topic>）或 Home Assistant 传感器实体 ID（sensor.<id> 或 ha:sensor.<id>）。如果未指定或您的捐赠状态不是最新的,此字段将不会发送到 PVOutput。
      ext_v10:
        name: 扩展数据 v10
        description: 用于填充 PVOutput 中 v10 扩展字段的数据源。您可以指定传感器类名、不带 'sensor.' 前缀的实体 ID、直接 MQTT 主题（或 mqtt:<topic>）或 Home Assistant 传感器实体 ID（sensor.<id> 或 ha:sensor.<id>）。如果未指定或您的捐赠状态不是最新的,此字段将不会发送到 PVOutput。
      ext_v11:
        name: 扩展数据 v11
        description: 用于填充 PVOutput 中 v11 扩展字段的数据源。您可以指定传感器类名、不带 'sensor.' 前缀的实体 ID、直接 MQTT 主题（或 mqtt:<topic>）或 Home Assistant 传感器实体 ID（sensor.<id> 或 ha:sensor.<id>）。如果未指定或您的捐赠状态不是最新的,此字段将不会发送到 PVOutput。
      ext_v12:
        name: 扩展数据 v12
        description: 用于填充 PVOutput 中 v12 扩展字段的数据源。您可以指定传感器类名、不带 'sensor.' 前缀的实体 ID、直接 MQTT 主题（或 mqtt:<topic>）或 Home Assistant 传感器实体 ID（sensor.<id> 或 ha:sensor.<id>）。如果未指定或您的捐赠状态不是最新的,此字段将不会发送到 PVOutput。
      temp_topic:
        name: 温度
        description: 发送到 PVOutput 的当前温度的数据源。您可以指定直接 MQTT 主题（或 mqtt:<topic>）或 Home Assistant 传感器实体 ID（sensor.<id> 或 ha:sensor.<id>）。如果未指定,温度将不会发送到 PVOutput。
  mqtt:
    name: MQTT 配置
    description: 连接到 MQTT 代理的配置。如果您使用的是 Home Assistant MQTT 应用，则无需配置此部分。
    fields:
      broker:
        name: 代理地址
        description: MQTT 代理的主机名或 IP 地址。
      port:
        name: MQTT 端口
        description: MQTT 代理的监听端口。默认 1883，使用 TLS 时为 8883。
      tls:
        name: 启用 TLS 通信
        description: 启用通过 TLS/SSL 与 MQTT 代理的安全通信（如果代理支持）。
      username:
        name: 用户名
        description: MQTT 代理的用户名。
      password:
        name: 密码
        description: MQTT 代理的密码。
  advanced:
    name: 高级设置
    description: sigenergy2mqtt 的高级配置设置
    fields:
      clean:
        name: 清除 MQTT 保留消息
        description: 清除 MQTT 保留消息以刷新 Home Assistant 中的 sigenergy2mqtt MQTT 设备。**请谨慎使用！** 所有引用 sigenergy2mqtt 传感器的 Home Assistant 助手都将被*删除*！
      consumption_method:
        name: 消费计算方式
        description: "`Plant Consumed Power` 传感器的计算方式。在早于支持 Modbus 协议 V2.8 的固件上，唯一可用的选项是 'Calculated'，所有其他值都将被_忽略_。对于 V2.8 固件，默认值为 'Total Load'。"
      read_only:
        name: 启用只读
        description: 启用后仅从 Sigenergy 设备读取数据。禁用后允许向 Sigenergy 设备写入数据。
      no_remote_ems:
        name: 禁用远程 EMS
        description: 启用后隐藏用于远程能源管理系统（EMS）集成的所有读写传感器。如果启用了 'Modbus Read Only'，则忽略此选项。
      no_ems_mode_check:
        name: 禁用远程 EMS 检查
        description: 启用后将关闭以下验证：当远程 EMS 控制模式不是 Command Charging/Discharging 时，禁用 ESS Max Charging/Discharging 和 PV Max Power 限制。如果启用了 'No Remote EMS'，则忽略此选项。（高级设置 - 请谨慎使用）
      edit_pct_box:
        name: 启用百分比框编辑器
        description: 启用后使用数字输入框更改百分比传感器的值；保持禁用则使用滑块更改。
      sigenergy_local_modbus_naming:
        name: Sigenergy-Local-Modbus 命名
        description: 启用后将对传感器使用 TypQxQ/Sigenergy-Local-Modbus 实体命名规范。（更改此选项时，您还应启用 MQTT 消息清理，否则 Home Assistant 将忽略新的实体名称。）
      metrics_enabled:
        name: 启用指标
        description: 启用向 Home Assistant 发布 sigenergy2mqtt 指标。
      sanity_check_default_kw:
        name: 验证默认 kW
        description: 用于验证功率传感器实际值的最大值和最小值以及能量传感器增量值的默认验证值（kW）。默认值为每秒 500 kW，即超出 ±500 范围的读数将被忽略。
      language:
        name: 语言
        description: sigenergy2mqtt使用的语言。默认值为"设置"→"系统"→"语言"中定义的语言，如果不支持该语言，则默认为英语。
      envvars:
        name: 环境变量
        description: 允许您为 sigenergy2mqtt 服务配置高级环境变量。可用环境变量的完整列表可在 https://github.com/seud0nym/sigenergy2mqtt/blob/main/resources/configuration/ENV.md#environment-variables 找到
        fields:
          name:
            name: 名称
            description: 环境变量的名称。
          value:
            name: 值
            description: 环境变量的值。
  logging:
    name: 日志配置
    description: 日志级别配置
    fields:
      sigenergy2mqtt:
        name: sigenergy2mqtt
        description: 设置 sigenergy2mqtt 日志级别。
      debug_sensor:
        name: 要调试的传感器
        description: 使用完整实体 ID、部分实体 ID、完整传感器类名或部分传感器类名指定要调试的传感器。也可以使用正则表达式。例如，指定 'daily' 将匹配实体名称中包含 daily 的所有传感器。如果已指定，sigenergy2mqtt 日志也将被强制设置为 DEBUG。
      app:
        name: 附加组件运行脚本
        description: 设置附加组件运行脚本的日志级别。警告！设置为 ALL、TRACE 或 DEBUG 将产生非常详细的输出。
      modbus:
        name: Modbus
        description: 设置 pymodbus 日志级别。警告！设置为 DEBUG 将产生非常详细的输出。
      pvoutput:
        name: PVOutput
        description: PVOutput 日志级别。
      mqtt:
        name: MQTT
        description: 设置 paho.mqtt 日志级别。警告！设置为 DEBUG 将产生非常详细的输出。
      influxdb:
        name: InfluxDB
        description: 设置 InfluxDB 日志级别。警告！设置为 DEBUG 可能会产生非常详细的输出。
      cloud:
        name: 云端
        description: 设置云端日志级别。警告！设置为 DEBUG 可能会产生非常详细的输出。
  cloud:
    name: 云端配置
    description: 用于访问非官方 Sigenergy mySigen Cloud API 以获取 Sigenergy 设备数据的配置。
    fields:
      region:
        name: 区域
        description: 您的 Sigenergy mySigen 账户所在的区域。
      username:
        name: 用户名
        description: 您的 Sigenergy Cloud 用户名。强烈建议创建并使用具有 "View and Edit" 权限的委托账户，而不是主 mySigen 账户，并且不要将该账户用于任何其他用途。有关创建委托账户的说明，请参阅文档。
      password:
        name: 密码
        description: 您的 Sigenergy Cloud 密码。
      accept_unofficial_api_risk:
        name: 接受非官方 API 风险
        description: 此云端集成使用非官方 mySigen API，这些 API 可能会发生变化，并可能随时被 Sigenergy 禁用。启用此选项即表示您了解使用非官方 API 的风险，并接受此集成可能随时失效且不另行通知。
      discover_inverters:
        name: 发现逆变器
        description: 启用逆变器发现。通常保持禁用，因为云端 API 目前不提供 Modbus 接口之外的额外信息。
  influxdb:
    name: InfluxDB 配置
    description: 用于将传感器数据写入 InfluxDB 数据库的配置。（这与 Home Assistant 的 InfluxDB 集成不同，后者仅发布启用的传感器，且不发布重复数据。）
    fields:
      enabled:
        name: 启用 InfluxDB
        description: 启用向 InfluxDB 发布传感器数据。
      host:
        name: 主机
        description: InfluxDB 数据库的主机名或 IP 地址。默认为 'a0d7b954-influxdb'（InfluxDB Home Assistant 附加组件的主机名）。
      port:
        name: 端口
        description: InfluxDB 数据库的监听端口。默认为 8086。
      username:
        name: 用户名
        description: InfluxDB 数据库的有效用户名。
      password:
        name: 密码
        description: InfluxDB 数据库用户的有效密码。
      database:
        name: 数据库
        description: 要使用的数据库名称。默认为 sigenergy。
      org:
        name: 组织
        description: InfluxDB v2 组织名称或 ID。如果未指定，将使用 v1 API。
      token:
        name: 令牌
        description: InfluxDB v2 认证令牌。如果提供，将优先使用 v2 API。
      bucket:
        name: 存储桶
        description: InfluxDB v2 存储桶名称。如果未指定，将使用 'database' 的值作为 v2 存储桶名称。
      include:
        name: 包含
        description: 发布到 InfluxDB 时要包含的传感器列表，使用完整或部分实体 ID、传感器类名或正则表达式。如果未指定，将包含所有传感器。
        fields:
          sensor:
            name: 传感器
            description: 发布到 InfluxDB 时要包含的传感器。
      exclude:
        name: 排除
        description: 发布到 InfluxDB 时要排除的传感器列表，使用完整或部分实体 ID、传感器类名或正则表达式。如果未指定，不会排除任何传感器。
        fields:
          sensor:
            name: 传感器
            description: 发布到 InfluxDB 时要排除的传感器。
