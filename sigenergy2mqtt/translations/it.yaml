configuration:
  auto_discovery:
    name: Rilevamento automatico dispositivi Sigenergy
    description: Configurazione per rilevare automaticamente i dispositivi Sigenergy
    fields:
      status:
        name: Stato
        description: Controlla il rilevamento automatico degli host Modbus Sigenergy e degli ID dispositivo associati. È necessario selezionare `Forced` solo se in precedenza sono stati rilevati automaticamente host/ID dispositivo e la rete o i dispositivi sono cambiati.
      max_device_id:
        name: ID dispositivo massimo
        description: L'ID dispositivo massimo da utilizzare durante il rilevamento automatico dei dispositivi Sigenergy sulla rete. Il valore predefinito è `10` e deve essere compreso tra 1 e 246 (inclusi). Questa opzione può velocizzare notevolmente il rilevamento automatico, con il rischio di non trovare dispositivi configurati con un ID dispositivo superiore al massimo consentito da questa impostazione.
      ping_timeout:
        name: Timeout ping
        description: Timeout ping in secondi per il rilevamento automatico. Predefinito 0,5 secondi.
      retries:
        name: Tentativi massimi
        description: Numero massimo di tentativi per il rilevamento automatico. Predefinito 0.
      timeout:
        name: Timeout Modbus
        description: Timeout Modbus in secondi per il rilevamento automatico. Predefinito 0,25 secondi.
  manual_config:
    name: Configurazione manuale dispositivo Sigenergy
    description: Configurazione per specificare manualmente i dettagli di connessione
    fields:
      host:
        name: Indirizzo host
        description: Nome host o indirizzo IP del dispositivo Sigenergy. Lascia vuoto per il rilevamento automatico.
      port:
        name: Porta Modbus
        description: Numero porta Modbus del dispositivo Sigenergy.
      inverter_device_id:
        name: ID dispositivo inverter
        description: L'ID dispositivo Modbus dell'inverter Sigenergy. Se si hanno più inverter, è possibile specificare un elenco di ID separati da spazi. Ignorato se non è specificato alcun host Modbus; in tal caso il rilevamento automatico può identificare gli inverter.
      accharger_device_id:
        name: ID dispositivo caricatore AC
        description: L'ID dispositivo Modbus del caricatore AC Sigenergy. Ignorato se non è specificato alcun host Modbus; in tal caso il rilevamento automatico può identificare i caricatori AC.
      dccharger_device_id:
        name: ID dispositivo caricatore DC
        description: L'ID dispositivo Modbus del caricatore DC Sigenergy (solitamente uguale all'ID dell'inverter). Ignorato se non è specificato alcun host Modbus; in tal caso il rilevamento automatico può identificare i caricatori DC.
  scan_interval:
    name: Intervalli di scansione sensori
    description: Configurazione degli intervalli di scansione per diverse classi di sensori
    fields:
      low:
        name: Bassa frequenza
        description: Intervallo di scansione in secondi per sensori a bassa frequenza. Predefinito 600, minimo 1.
      medium:
        name: Frequenza media
        description: Intervallo di scansione in secondi per sensori a frequenza media. Predefinito 60, minimo 1.
      high:
        name: Alta frequenza
        description: Intervallo di scansione in secondi per sensori ad alta frequenza. Predefinito 10, minimo 1.
      realtime:
        name: Quasi tempo reale
        description: Intervallo di scansione in secondi per sensori in tempo reale. Predefinito 5, minimo 1.
      cloud:
        name: Frequenza cloud
        description: Intervallo di scansione in secondi per il recupero dei dati cloud. Predefinito 5, minimo 1.
  pvoutput:
    name: Integrazione PVOutput.org
    description: Configurazione per l'integrazione con PVOutput.org per caricare i dati di generazione e consumo
    fields:
      enabled:
        name: Abilita caricamento
        description: Abilita aggiornamenti di stato su PVOutput.
      api_key:
        name: Chiave API
        description: La chiave API per PVOutput
      system_id:
        name: ID sistema
        description: L'ID del sistema PVOutput
      consumption:
        name: Abilita caricamento consumo
        description: Invia stato consumo a PVOutput.
      exports:
        name: Abilita caricamento esportazione
        description: Invia dati di esportazione a PVOutput.
      imports:
        name: Abilita caricamento importazione
        description: Invia dati di importazione a PVOutput.
      eod_update:
        name: Abilita caricamento fine giornata
        description: Se abilitato, il picco di generazione e i totali giornalieri di esportazioni e importazioni (se abilitati) vengono inviati a PVOutput a fine giornata. Se disabilitato, questi valori vengono caricati con la stessa cadenza degli aggiornamenti di stato.
      voltage:
        name: Sorgente tensione
        description: La sorgente del valore di tensione da inviare a PVOutput. Usare 'Phase A' per i sistemi monofase, 'Phase B', 'Phase C' o 'Line to Line Average' per i sistemi trifase oppure 'Line to Neutral Average' o 'PV Average' per entrambi.
      ext_v7:
        name: Dati estesi v7
        description: Una sorgente utilizzata per popolare il campo esteso v7 in PVOutput. È possibile specificare un nome di classe del sensore, un ID entità senza il prefisso 'sensor.', un topic MQTT diretto (o mqtt:<topic>) o un ID entità del sensore di Home Assistant (sensor.<id> o ha:sensor.<id>). Se non specificato, O se lo stato della donazione non è aggiornato, questo campo non verrà inviato a PVOutput.
      ext_v8:
        name: Dati estesi v8
        description: Una sorgente utilizzata per popolare il campo esteso v8 in PVOutput. È possibile specificare un nome di classe del sensore, un ID entità senza il prefisso 'sensor.', un topic MQTT diretto (o mqtt:<topic>) o un ID entità del sensore di Home Assistant (sensor.<id> o ha:sensor.<id>). Se non specificato, O se lo stato della donazione non è aggiornato, questo campo non verrà inviato a PVOutput.
      ext_v9:
        name: Dati estesi v9
        description: Una sorgente utilizzata per popolare il campo esteso v9 in PVOutput. È possibile specificare un nome di classe del sensore, un ID entità senza il prefisso 'sensor.', un topic MQTT diretto (o mqtt:<topic>) o un ID entità del sensore di Home Assistant (sensor.<id> o ha:sensor.<id>). Se non specificato, O se lo stato della donazione non è aggiornato, questo campo non verrà inviato a PVOutput.
      ext_v10:
        name: Dati estesi v10
        description: Una sorgente utilizzata per popolare il campo esteso v10 in PVOutput. È possibile specificare un nome di classe del sensore, un ID entità senza il prefisso 'sensor.', un topic MQTT diretto (o mqtt:<topic>) o un ID entità del sensore di Home Assistant (sensor.<id> o ha:sensor.<id>). Se non specificato, O se lo stato della donazione non è aggiornato, questo campo non verrà inviato a PVOutput.
      ext_v11:
        name: Dati estesi v11
        description: Una sorgente utilizzata per popolare il campo esteso v11 in PVOutput. È possibile specificare un nome di classe del sensore, un ID entità senza il prefisso 'sensor.', un topic MQTT diretto (o mqtt:<topic>) o un ID entità del sensore di Home Assistant (sensor.<id> o ha:sensor.<id>). Se non specificato, O se lo stato della donazione non è aggiornato, questo campo non verrà inviato a PVOutput.
      ext_v12:
        name: Dati estesi v12
        description: Una sorgente utilizzata per popolare il campo esteso v12 in PVOutput. È possibile specificare un nome di classe del sensore, un ID entità senza il prefisso 'sensor.', un topic MQTT diretto (o mqtt:<topic>) o un ID entità del sensore di Home Assistant (sensor.<id> o ha:sensor.<id>). Se non specificato, O se lo stato della donazione non è aggiornato, questo campo non verrà inviato a PVOutput.
      temp_topic:
        name: Temperatura
        description: Una sorgente per la temperatura corrente inviata a PVOutput. È possibile specificare un topic MQTT diretto (o mqtt:<topic>) o un ID entità del sensore di Home Assistant (sensor.<id> o ha:sensor.<id>). Se non specificato, la temperatura non verrà inviata a PVOutput.
  mqtt:
    name: Configurazione MQTT
    description: Configurazione per la connessione al broker MQTT. Non è necessario configurare questa sezione se si utilizza l'app MQTT di Home Assistant.
    fields:
      broker:
        name: Indirizzo broker
        description: Nome host o indirizzo IP del broker MQTT.
      port:
        name: Porta MQTT
        description: Porta di ascolto del broker MQTT. Predefinito 1883, o 8883 con TLS.
      tls:
        name: Abilita comunicazione TLS
        description: Abilita la comunicazione sicura con il broker MQTT tramite TLS/SSL (se il broker la supporta).
      username:
        name: Nome utente
        description: Nome utente per il broker MQTT.
      password:
        name: Parola chiave
        description: Password per il broker MQTT.
  advanced:
    name: Impostazioni avanzate
    description: Impostazioni di configurazione avanzate per sigenergy2mqtt
    fields:
      clean:
        name: Pulisci messaggi MQTT conservati
        description: Pulisci i messaggi MQTT conservati per aggiornare i dispositivi MQTT di sigenergy2mqtt in Home Assistant. **USARE CON CAUTELA!** Tutti gli helper di Home Assistant definiti che fanno riferimento ai sensori di sigenergy2mqtt verranno *rimossi*!
      consumption_method:
        name: Metodo di consumo
        description: Il metodo di calcolo del sensore `Plant Consumed Power`. Sul firmware precedente a quello che supporta il protocollo Modbus V2.8, l'unica opzione disponibile è 'Calculated' e tutti gli altri valori vengono _ignorati_. Per il firmware V2.8, il valore predefinito è 'Total Load'.
      read_only:
        name: Abilita sola lettura
        description: Abilita per leggere solo i dati dal dispositivo Sigenergy. Disabilita per consentire la scrittura dei dati sul dispositivo Sigenergy.
      no_remote_ems:
        name: Disabilita EMS remoto
        description: Abilita per nascondere tutti i sensori di lettura/scrittura utilizzati per l'integrazione del sistema di gestione dell'energia (EMS) remoto. Ignorato se 'Modbus Read Only' è abilitato.
      no_ems_mode_check:
        name: Disabilita controlli EMS remoto
        description: Abilita per DISATTIVARE la validazione che disabilita i limiti ESS Max Charging/Discharging e PV Max Power quando la modalità di controllo EMS remoto non è Command Charging/Discharging. Ignorato se 'No Remote EMS' è abilitato. (Impostazione avanzata - usare con cautela)
      edit_pct_box:
        name: Abilita editor casella percentuale
        description: Abilita per usare una casella di input numerico per modificare il valore dei sensori percentuali, oppure lascia disabilitato per usare un cursore.
      sigenergy_local_modbus_naming:
        name: Denominazione Sigenergy-Local-Modbus
        description: Abilitare per utilizzare la convenzione di denominazione delle entità TypQxQ/Sigenergy-Local-Modbus per i sensori. (È consigliabile abilitare anche la pulizia dei messaggi MQTT quando si modifica questa opzione, altrimenti i nuovi nomi delle entità verranno ignorati da Home Assistant.)
      metrics_enabled:
        name: Abilita metriche
        description: Abilita la pubblicazione delle metriche di sigenergy2mqtt su Home Assistant.
      sanity_check_default_kw:
        name: kW predefinito per verifica
        description: Il valore predefinito in kW utilizzato per le verifiche di coerenza, per convalidare i valori massimo e minimo del valore effettivo dei sensori di potenza e del valore delta dei sensori di energia. Il valore predefinito è 500 kW al secondo, il che significa che le letture al di fuori dell'intervallo ±500 vengono ignorate.
      language:
        name: Lingua
        description: La lingua da utilizzare per sigenergy2mqtt. L'impostazione predefinita è quella definita in Impostazioni → Sistema → Lingua o, se tale lingua non è supportata, l'impostazione predefinita è l'inglese.
      envvars:
        name: Variabili d'ambiente
        description: Consente di configurare variabili d'ambiente avanzate per il servizio sigenergy2mqtt. L'elenco completo delle variabili d'ambiente disponibili è disponibile su https://github.com/seud0nym/sigenergy2mqtt/blob/main/resources/configuration/ENV.md#environment-variables
        fields:
          name:
            name: Nome
            description: Il nome della variabile d'ambiente.
          value:
            name: Valore
            description: Il valore della variabile d'ambiente.
  logging:
    name: Configurazione registrazione
    description: Configurazione dei livelli di registrazione
    fields:
      sigenergy2mqtt:
        name: sigenergy2mqtt
        description: Imposta livello di registrazione di sigenergy2mqtt.
      debug_sensor:
        name: Sensore da debuggare
        description: Specifica un sensore da debuggare usando l'ID entità completo, un ID entità parziale, il nome completo della classe del sensore o un nome parziale della classe. È possibile usare anche le espressioni regolari. Ad esempio, specificando 'daily' verrebbero individuati tutti i sensori con daily nel nome dell'entità. Se specificato, anche la registrazione di sigenergy2mqtt viene forzata a DEBUG.
      app:
        name: Script di esecuzione app
        description: Imposta il livello di registrazione dello script di esecuzione dell'app. ATTENZIONE! Impostarlo su ALL, TRACE o DEBUG produrrà un output molto dettagliato.
      modbus:
        name: Modbus
        description: Imposta il livello di registrazione di pymodbus. ATTENZIONE! Impostarlo su DEBUG produrrà un output molto dettagliato.
      pvoutput:
        name: PVOutput
        description: Livello di registrazione di PVOutput.
      mqtt:
        name: MQTT
        description: Imposta il livello di registrazione di paho.mqtt. ATTENZIONE! Impostarlo su DEBUG produrrà un output molto dettagliato.
      influxdb:
        name: InfluxDB
        description: Imposta il livello di registrazione di InfluxDB. ATTENZIONE! Impostarlo su DEBUG può produrre un output molto dettagliato.
      cloud:
        name: Cloud
        description: Imposta livello di registrazione del cloud. ATTENZIONE! Impostarlo su DEBUG può produrre un output molto dettagliato.
  cloud:
    name: Configurazione cloud
    description: Configurazione per accedere all'API non ufficiale Sigenergy mySigen Cloud e recuperare i dati dai dispositivi Sigenergy.
    fields:
      region:
        name: Regione
        description: La regione in cui si trova l'account Sigenergy mySigen.
      username:
        name: Nome utente
        description: Il nome utente Sigenergy Cloud. Si consiglia vivamente di creare e utilizzare un account delegato con accesso "View and Edit" al posto dell'account mySigen principale e di non utilizzare questo account per altri scopi. Consultare la documentazione per le istruzioni sulla creazione di un account delegato.
      password:
        name: Parola chiave
        description: La password dell'account Sigenergy Cloud.
      accept_unofficial_api_risk:
        name: Accetta rischio API non ufficiale
        description: Questa integrazione cloud utilizza API mySigen non ufficiali che potrebbero cambiare e che Sigenergy può disabilitare in qualsiasi momento. Abilitando questa opzione, si riconosce di comprendere i rischi dell'uso di API non ufficiali e di accettare che questa integrazione possa smettere di funzionare in qualsiasi momento senza preavviso.
      discover_inverters:
        name: Rileva inverter
        description: Abilita il rilevamento degli inverter. Di solito va lasciato disabilitato perché l'API cloud al momento non fornisce informazioni aggiuntive rispetto a quelle dell'interfaccia Modbus.
  influxdb:
    name: Configurazione InfluxDB
    description: Configurazione per scrivere i dati dei sensori nel database InfluxDB. (Questo è diverso dall'integrazione di Home Assistant con InfluxDB, che pubblica solo i sensori abilitati e non pubblica dati ripetuti.)
    fields:
      enabled:
        name: Abilita InfluxDB
        description: Abilita la pubblicazione dei dati dei sensori su InfluxDB.
      host:
        name: Indirizzo server
        description: Nome host o indirizzo IP del database InfluxDB. Predefinito 'a0d7b954-influxdb' (nome host dell'app InfluxDB di Home Assistant).
      port:
        name: Porta
        description: Porta di ascolto del database InfluxDB. Predefinito 8086.
      username:
        name: Nome utente
        description: Nome utente valido per il database InfluxDB.
      password:
        name: Parola chiave
        description: Password valida per l'utente del database InfluxDB.
      database:
        name: Banca dati
        description: Nome del database da utilizzare. Predefinito sigenergy.
      org:
        name: Organizzazione
        description: Nome o ID dell'organizzazione InfluxDB v2. Se non specificato, verrà utilizzata l'API v1.
      token:
        name: Gettone di accesso
        description: Token di autenticazione InfluxDB v2. Se fornito, verranno utilizzate preferibilmente le API v2.
      bucket:
        name: Contenitore
        description: Nome del bucket InfluxDB v2. Se non specificato, verrà utilizzato il valore di 'database' come nome del bucket v2.
      include:
        name: Includi
        description: Elenco dei sensori da includere durante la pubblicazione su InfluxDB, utilizzando l'ID entità completo o parziale, il nome della classe del sensore o un'espressione regolare. Se non specificato, verranno inclusi tutti i sensori.
        fields:
          sensor:
            name: Sensore
            description: Il sensore da includere durante la pubblicazione su InfluxDB.
      exclude:
        name: Escludi
        description: Elenco dei sensori da escludere durante la pubblicazione su InfluxDB, utilizzando l'ID entità completo o parziale, il nome della classe del sensore o un'espressione regolare. Se non specificato, non verrà escluso alcun sensore.
        fields:
          sensor:
            name: Sensore
            description: Il sensore da escludere durante la pubblicazione su InfluxDB.
