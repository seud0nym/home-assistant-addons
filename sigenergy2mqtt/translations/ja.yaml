configuration:
  auto_discovery:
    name: Sigenergy デバイス自動検出
    description: Sigenergy デバイスを自動的に検出するための設定
    fields:
      status:
        name: ステータス
        description: Sigenergy Modbus ホストおよび関連するデバイス IDの自動検出を制御します。以前にホスト/デバイス IDを自動検出済みで、ネットワークまたはデバイスが変更された場合にのみ `Forced` を選択する必要があります。
      max_device_id:
        name: デバイス ID の最大値
        description: ネットワーク上の Sigenergy デバイスを自動検出する際に使用するデバイス ID の最大値です。デフォルトは `10` で、1 から 246 の範囲（両端を含む）で指定する必要があります。このオプションを使用すると自動検出を大幅に高速化できますが、この設定で許可された最大値より高いデバイス ID が設定されたデバイスが見つからないリスクがあります。
      ping_timeout:
        name: Ping タイムアウト
        description: 自動検出時のPingタイムアウト（秒）。デフォルトは0.5秒。
      retries:
        name: 最大リトライ回数
        description: 自動検出時の最大リトライ回数。デフォルトは0。
      timeout:
        name: Modbus タイムアウト
        description: 自動検出時のModbusタイムアウト（秒）。デフォルトは0.25秒。
  manual_config:
    name: Sigenergy デバイス手動設定
    description: 接続詳細を手動で指定するための設定
    fields:
      host:
        name: ホストアドレス
        description: Sigenergy デバイスのホスト名またはIPアドレス。自動検出の場合は空欄にしてください。
      port:
        name: Modbus ポート
        description: Sigenergy デバイスのModbusポート番号。
      inverter_device_id:
        name: インバーターデバイスID
        description: Sigenergy インバーターの Modbus デバイス ID。複数のインバーターがある場合は、スペース区切りの ID リストを指定できます。Modbus ホストが指定されていない場合は無視されます。その場合、自動検出がインバーターデバイスを識別できます。
      accharger_device_id:
        name: AC充電器デバイスID
        description: Sigenergy AC 充電器の Modbus デバイス ID。Modbus ホストが指定されていない場合は無視されます。その場合、自動検出が AC 充電器デバイスを識別できます。
      dccharger_device_id:
        name: DC充電器デバイスID
        description: Sigenergy DC 充電器の Modbus デバイス ID（通常はインバーターデバイス ID と同じ）。Modbus ホストが指定されていない場合は無視されます。その場合、自動検出が DC 充電器デバイスを識別できます。
  scan_interval:
    name: センサースキャン間隔
    description: 異なるセンサークラスのスキャン間隔の設定
    fields:
      low:
        name: 低頻度
        description: 低頻度センサーのスキャン間隔（秒）。デフォルト600、最小1。
      medium:
        name: 中頻度
        description: 中頻度センサーのスキャン間隔（秒）。デフォルト60、最小1。
      high:
        name: 高頻度
        description: 高頻度センサーのスキャン間隔（秒）。デフォルト10、最小1。
      realtime:
        name: ほぼリアルタイム
        description: リアルタイムセンサーのスキャン間隔（秒）。デフォルト5、最小1。
      cloud:
        name: クラウド頻度
        description: クラウドデータを取得するスキャン間隔（秒）。デフォルト5、最小1。
  pvoutput:
    name: PVOutput.org 連携
    description: 発電量と消費量のデータをアップロードするための PVOutput.org との連携設定
    fields:
      enabled:
        name: アップロードを有効化
        description: PVOutput へのステータス更新を有効にします。
      api_key:
        name: APIキー
        description: PVOutput のAPIキー
      system_id:
        name: システムID
        description: PVOutput のシステムID
      consumption:
        name: 消費量アップロードを有効化
        description: 消費状況を PVOutput に送信します。
      exports:
        name: エクスポートアップロードを有効化
        description: エクスポートデータを PVOutput に送信します。
      imports:
        name: インポートアップロードを有効化
        description: インポートデータを PVOutput に送信します。
      eod_update:
        name: 日終アップロードを有効化
        description: 有効にすると、ピーク発電量とエクスポート・インポート（有効な場合）の日次合計が、一日の終わりに PVOutput へ送信されます。無効にすると、これらの値はステータス更新と同じスケジュールでアップロードされます。
      voltage:
        name: 電圧ソース
        description: PVOutput に送信する電圧値のソース。単相システムには 'Phase A'、三相システムには 'Phase B'、'Phase C' または 'Line to Line Average'、どちらにも使えるものとして 'Line to Neutral Average' または 'PV Average' を使用します。
      ext_v7:
        name: 拡張データ v7
        description: PVOutput の v7 拡張フィールドに入力するために使用するソース。センサークラス名、'sensor.' プレフィックスなしのエンティティ ID、直接 MQTT トピック（または mqtt:<topic>）、または Home Assistant センサーエンティティ ID（sensor.<id> または ha:sensor.<id>）を指定できます。指定されていない場合、または寄付ステータスが最新でない場合、このフィールドは PVOutput に送信されません。
      ext_v8:
        name: 拡張データ v8
        description: PVOutput の v8 拡張フィールドに入力するために使用するソース。センサークラス名、'sensor.' プレフィックスなしのエンティティ ID、直接 MQTT トピック（または mqtt:<topic>）、または Home Assistant センサーエンティティ ID（sensor.<id> または ha:sensor.<id>）を指定できます。指定されていない場合、または寄付ステータスが最新でない場合、このフィールドは PVOutput に送信されません。
      ext_v9:
        name: 拡張データ v9
        description: PVOutput の v9 拡張フィールドに入力するために使用するソース。センサークラス名、'sensor.' プレフィックスなしのエンティティ ID、直接 MQTT トピック（または mqtt:<topic>）、または Home Assistant センサーエンティティ ID（sensor.<id> または ha:sensor.<id>）を指定できます。指定されていない場合、または寄付ステータスが最新でない場合、このフィールドは PVOutput に送信されません。
      ext_v10:
        name: 拡張データ v10
        description: PVOutput の v10 拡張フィールドに入力するために使用するソース。センサークラス名、'sensor.' プレフィックスなしのエンティティ ID、直接 MQTT トピック（または mqtt:<topic>）、または Home Assistant センサーエンティティ ID（sensor.<id> または ha:sensor.<id>）を指定できます。指定されていない場合、または寄付ステータスが最新でない場合、このフィールドは PVOutput に送信されません。
      ext_v11:
        name: 拡張データ v11
        description: PVOutput の v11 拡張フィールドに入力するために使用するソース。センサークラス名、'sensor.' プレフィックスなしのエンティティ ID、直接 MQTT トピック（または mqtt:<topic>）、または Home Assistant センサーエンティティ ID（sensor.<id> または ha:sensor.<id>）を指定できます。指定されていない場合、または寄付ステータスが最新でない場合、このフィールドは PVOutput に送信されません。
      ext_v12:
        name: 拡張データ v12
        description: PVOutput の v12 拡張フィールドに入力するために使用するソース。センサークラス名、'sensor.' プレフィックスなしのエンティティ ID、直接 MQTT トピック（または mqtt:<topic>）、または Home Assistant センサーエンティティ ID（sensor.<id> または ha:sensor.<id>）を指定できます。指定されていない場合、または寄付ステータスが最新でない場合、このフィールドは PVOutput に送信されません。
      temp_topic:
        name: 温度
        description: PVOutput に送信される現在の温度のソース。直接 MQTT トピック（または mqtt:<topic>）または Home Assistant センサーエンティティ ID（sensor.<id> または ha:sensor.<id>）を指定できます。指定されていない場合、温度は PVOutput に送信されません。
  mqtt:
    name: MQTT 設定
    description: MQTT ブローカーへの接続設定。Home Assistant の MQTT アプリを使用している場合、このセクションを設定する必要はありません。
    fields:
      broker:
        name: ブローカーアドレス
        description: MQTT ブローカーのホスト名または IP アドレス。
      port:
        name: MQTT ポート
        description: MQTT ブローカーのリスニングポート。デフォルト1883、TLS使用時は8883。
      tls:
        name: TLS 通信を有効化
        description: TLS/SSL による MQTT ブローカーへのセキュア通信を有効にします（ブローカーが対応している場合）。
      username:
        name: ユーザー名
        description: MQTT ブローカーのユーザー名。
      password:
        name: パスワード
        description: MQTT ブローカーのパスワード。
  advanced:
    name: 詳細設定
    description: sigenergy2mqtt の詳細設定
    fields:
      clean:
        name: MQTT 保持メッセージをクリア
        description: MQTT 保持メッセージをクリアして、Home Assistant の sigenergy2mqtt MQTT デバイスを更新します。**注意して使用してください！** sigenergy2mqtt センサーを参照している Home Assistant ヘルパーはすべて*削除*されます！
      consumption_method:
        name: 消費量計算方式
        description: "`Plant Consumed Power` センサーの計算方式。Modbus プロトコル V2.8 に対応するより前のファームウェアでは、使用できるオプションは 'Calculated' のみで、他の値はすべて_無視_されます。V2.8 ファームウェアではデフォルトは 'Total Load' です。"
      read_only:
        name: 読み取り専用を有効化
        description: 有効にすると、Sigenergy デバイスからのデータ読み取りのみを行います。無効にすると、Sigenergy デバイスへのデータ書き込みが可能になります。
      no_remote_ems:
        name: リモート EMS を無効化
        description: 有効にすると、リモートエネルギーマネジメントシステム（EMS）連携に使用するすべての読み書きセンサーを非表示にします。'Modbus Read Only' が有効な場合は無視されます。
      no_ems_mode_check:
        name: リモート EMS チェックを無効化
        description: 有効にすると、リモート EMS 制御モードが Command Charging/Discharging でない場合に ESS Max Charging/Discharging および PV Max Power の制限を無効にする検証をオフにします。'No Remote EMS' が有効な場合は無視されます。（詳細設定 - 注意して使用してください）
      edit_pct_box:
        name: パーセントボックスエディタを有効化
        description: 有効にすると、パーセントセンサーの値を数値入力ボックスで変更します。無効のままにするとスライダーで変更します。
      sigenergy_local_modbus_naming:
        name: Sigenergy-Local-Modbus 命名
        description: センサーに TypQxQ/Sigenergy-Local-Modbus エンティティ命名規則を使用するには有効にしてください。（このオプションを変更する際は MQTT メッセージのクリーニングも有効にしてください。有効にしない場合、新しいエンティティ名は Home Assistant に無視されます。）
      metrics_enabled:
        name: メトリクスを有効化
        description: sigenergy2mqtt メトリクスの Home Assistant への公開を有効にします。
      sanity_check_default_kw:
        name: サニティチェックのデフォルト kW
        description: 電力センサーの実測値およびエネルギーセンサーの差分値の最大値・最小値を検証するサニティチェックに使用するデフォルト値（kW）。デフォルトは毎秒 500 kW で、±500 の範囲外の測定値は無視されます。
      language:
        name: 言語
        description: sigenergy2mqtt に使用する言語。デフォルトは「設定」→「システム」→「言語」で定義されたものです。その言語がサポートされていない場合、デフォルトは英語になります。
      envvars:
        name: 環境変数
        description: sigenergy2mqttサービスの高度な環境変数を設定できます。利用可能な環境変数の完全なリストは、https://github.com/seud0nym/sigenergy2mqtt/blob/main/resources/configuration/ENV.md#environment-variables にあります。
        fields:
          name:
            name: 名前
            description: 環境変数の名前。
          value:
            name: 値
            description: 環境変数の値。
  logging:
    name: ログ設定
    description: ログレベルの設定
    fields:
      sigenergy2mqtt:
        name: sigenergy2mqtt
        description: sigenergy2mqtt のログレベルを設定します。
      debug_sensor:
        name: デバッグするセンサー
        description: デバッグするセンサーを、完全なエンティティ ID、部分的なエンティティ ID、完全なセンサークラス名、または部分的なセンサークラス名で指定します。正規表現も使用できます。たとえば 'daily' を指定すると、エンティティ名に daily を含むすべてのセンサーに一致します。指定した場合、sigenergy2mqtt のログも強制的に DEBUG になります。
      app:
        name: アドオン実行スクリプト
        description: アドオン実行スクリプトのログレベルを設定します。警告！ALL、TRACE、DEBUG に設定すると非常に冗長な出力になります。
      modbus:
        name: Modbus
        description: pymodbus のログレベルを設定します。警告！DEBUG に設定すると非常に冗長な出力になります。
      pvoutput:
        name: PVOutput
        description: PVOutput のログレベル。
      mqtt:
        name: MQTT
        description: paho.mqtt のログレベルを設定します。警告！DEBUG に設定すると非常に冗長な出力になります。
      influxdb:
        name: InfluxDB
        description: InfluxDB のログレベルを設定します。警告！DEBUG に設定すると非常に冗長な出力になる場合があります。
      cloud:
        name: クラウド
        description: クラウドのログレベルを設定します。警告！DEBUG に設定すると非常に冗長な出力になる場合があります。
  cloud:
    name: クラウド設定
    description: 非公式の Sigenergy mySigen Cloud API にアクセスして Sigenergy デバイスのデータを取得するための設定。
    fields:
      region:
        name: リージョン
        description: Sigenergy mySigen アカウントが存在するリージョン。
      username:
        name: ユーザー名
        description: Sigenergy Cloud のユーザー名。メインの mySigen アカウントではなく、"View and Edit" アクセス権を持つ委任アカウントを作成して使用し、そのアカウントを他の目的に使用しないことを強くお勧めします。委任アカウントの作成手順についてはドキュメントを参照してください。
      password:
        name: パスワード
        description: Sigenergy Cloud のパスワード。
      accept_unofficial_api_risk:
        name: 非公式APIのリスクを承諾
        description: このクラウド連携は、変更される可能性があり、Sigenergy によりいつでも無効化される可能性がある非公式の mySigen API を使用します。このオプションを有効にすることで、非公式 API を使用するリスクを理解し、この連携が予告なくいつでも動作しなくなる可能性があることを承諾したものとみなされます。
      discover_inverters:
        name: インバーターを検出
        description: インバーターの検出を有効にします。現時点ではクラウド API が Modbus インターフェースで提供される情報以上の追加情報を提供しないため、通常は無効のままにしてください。
  influxdb:
    name: InfluxDB 設定
    description: センサーデータを InfluxDB データベースに書き込むための設定。（これは Home Assistant の InfluxDB 統合とは異なり、有効なセンサーのみを公開し、繰り返しデータは公開しません。）
    fields:
      enabled:
        name: InfluxDB を有効化
        description: InfluxDB へのセンサーデータの公開を有効にします。
      host:
        name: ホスト
        description: InfluxDB データベースのホスト名または IP アドレス。デフォルトは 'a0d7b954-influxdb'（InfluxDB Home Assistant アドオンのホスト名）。
      port:
        name: ポート
        description: InfluxDB データベースのリスニングポート。デフォルトは 8086。
      username:
        name: ユーザー名
        description: InfluxDB データベースの有効なユーザー名。
      password:
        name: パスワード
        description: InfluxDB データベースユーザーの有効なパスワード。
      database:
        name: データベース
        description: 使用するデータベース名。デフォルトは sigenergy。
      org:
        name: 組織
        description: InfluxDB v2 組織名または ID。指定しない場合は v1 API が使用されます。
      token:
        name: トークン
        description: InfluxDB v2 認証トークン。指定された場合、v2 API が優先的に使用されます。
      bucket:
        name: バケット
        description: InfluxDB v2 バケット名。指定しない場合は 'database' の値が v2 バケット名として使用されます。
      include:
        name: 含める
        description: InfluxDB への公開時に含めるセンサーのリスト。完全または部分的なエンティティ ID、センサークラス名、または正規表現を使用できます。指定しない場合、すべてのセンサーが含まれます。
        fields:
          sensor:
            name: センサー
            description: InfluxDB への公開時に含めるセンサー。
      exclude:
        name: 除外する
        description: InfluxDB への公開時に除外するセンサーのリスト。完全または部分的なエンティティ ID、センサークラス名、または正規表現を使用できます。指定しない場合、除外されるセンサーはありません。
        fields:
          sensor:
            name: センサー
            description: InfluxDB への公開時に除外するセンサー。
