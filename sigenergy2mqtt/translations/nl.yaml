configuration:
  auto_discovery:
    name: Automatische Sigenergy apparaatdetectie
    description: Configuratie voor automatische detectie van uw Sigenergy apparaten
    fields:
      status:
        name: Status
        description: Beheert de automatische detectie van Sigenergy Modbus-hosts en bijbehorende apparaat-ID's. U hoeft alleen `Forced` te selecteren als u eerder automatisch hosts/apparaat-ID's hebt gedetecteerd en uw netwerk of apparaten zijn gewijzigd.
      max_device_id:
        name: Max. apparaat-ID
        description: Het maximale apparaat-ID dat wordt gebruikt bij de automatische detectie van Sigenergy-apparaten op het netwerk. De standaardwaarde is `10` en moet tussen 1 en 246 (inclusief) liggen. Deze optie kan de automatische detectie aanzienlijk versnellen, maar met het risico dat apparaten die zijn geconfigureerd met een hoger apparaat-ID dan het door deze instelling toegestane maximum niet worden gevonden.
      ping_timeout:
        name: Ping timeout
        description: Ping timeout in seconden voor automatische detectie. Standaard 0,5 seconden.
      retries:
        name: Maximale pogingen
        description: Maximaal aantal pogingen voor automatische detectie. Standaard 0.
      timeout:
        name: Modbus timeout
        description: Modbus timeout in seconden voor automatische detectie. Standaard 0,25 seconden.
  manual_config:
    name: Handmatige Sigenergy apparaatconfiguratie
    description: Configuratie voor handmatig specificeren van verbindingsdetails
    fields:
      host:
        name: Hostadres
        description: Hostnaam of IP-adres van het Sigenergy apparaat. Laat leeg voor automatische detectie.
      port:
        name: Modbus poort
        description: Modbus poortnummer van het Sigenergy apparaat.
      inverter_device_id:
        name: Omvormer apparaat-ID
        description: De Sigenergy omvormer Modbus apparaat-ID. Als u meerdere omvormers heeft, kunt u een door spaties gescheiden lijst met ID's opgeven. Wordt genegeerd als er geen Modbus-host is opgegeven; in dat geval kan automatische detectie de omvormers identificeren.
      accharger_device_id:
        name: AC-lader apparaat-ID
        description: De Sigenergy AC-lader Modbus apparaat-ID. Wordt genegeerd als er geen Modbus-host is opgegeven; in dat geval kan automatische detectie de AC-laders identificeren.
      dccharger_device_id:
        name: DC-lader apparaat-ID
        description: De Sigenergy DC-lader Modbus apparaat-ID (meestal gelijk aan de omvormer apparaat-ID). Wordt genegeerd als er geen Modbus-host is opgegeven; in dat geval kan automatische detectie de DC-laders identificeren.
  scan_interval:
    name: Sensor scan-intervallen
    description: Configuratie van scan-intervallen voor verschillende sensorklassen
    fields:
      low:
        name: Lage frequentie
        description: Scan-interval in seconden voor sensoren met lage frequentie. Standaard 600, minimum 1.
      medium:
        name: Gemiddelde frequentie
        description: Scan-interval in seconden voor sensoren met gemiddelde frequentie. Standaard 60, minimum 1.
      high:
        name: Hoge frequentie
        description: Scan-interval in seconden voor sensoren met hoge frequentie. Standaard 10, minimum 1.
      realtime:
        name: Bijna realtime
        description: Scan-interval in seconden voor realtime sensoren. Standaard 5, minimum 1.
      cloud:
        name: Cloud-frequentie
        description: Scan-interval in seconden voor het ophalen van clouddata. Standaard 5, minimum 1.
  pvoutput:
    name: PVOutput.org Integratie
    description: Configuratie voor integratie met PVOutput.org om opwekkings- en verbruiksgegevens te uploaden
    fields:
      enabled:
        name: Upload inschakelen
        description: Statusupdates naar PVOutput inschakelen.
      api_key:
        name: API-sleutel
        description: De API-sleutel voor PVOutput
      system_id:
        name: Systeem-ID
        description: De PVOutput systeem-ID
      consumption:
        name: Verbruiksuploads inschakelen
        description: Verbruiksstatus naar PVOutput verzenden.
      exports:
        name: Exportuploads inschakelen
        description: Exportgegevens naar PVOutput verzenden.
      imports:
        name: Importuploads inschakelen
        description: Importgegevens naar PVOutput verzenden.
      eod_update:
        name: Einde-dag upload inschakelen
        description: Indien ingeschakeld worden de piekopwekking en de dagtotalen voor export en import (indien ingeschakeld) aan het einde van de dag naar PVOutput verzonden. Indien uitgeschakeld worden deze waarden geüpload volgens hetzelfde schema als de statusupdates.
      voltage:
        name: Spanningsbron
        description: De bron van de spanningswaarde die naar PVOutput wordt verzonden. Gebruik 'Phase A' voor enkelfasesystemen, 'Phase B', 'Phase C' of 'Line to Line Average' voor driefasesystemen, of 'Line to Neutral Average' of 'PV Average' voor beide.
      ext_v7:
        name: Uitgebreide gegevens v7
        description: Een bron die wordt gebruikt om het v7 uitgebreide veld in PVOutput te vullen. U kunt een sensorklassenaam, een entiteit-ID zonder het voorvoegsel 'sensor.', een direct MQTT-onderwerp (of mqtt:<topic>), of een Home Assistant sensor entiteit-ID (sensor.<id> of ha:sensor.<id>) opgeven. Als dit niet is opgegeven, OF als uw donatiestatus niet actueel is, wordt dit veld niet naar PVOutput verzonden.
      ext_v8:
        name: Uitgebreide gegevens v8
        description: Een bron die wordt gebruikt om het v8 uitgebreide veld in PVOutput te vullen. U kunt een sensorklassenaam, een entiteit-ID zonder het voorvoegsel 'sensor.', een direct MQTT-onderwerp (of mqtt:<topic>), of een Home Assistant sensor entiteit-ID (sensor.<id> of ha:sensor.<id>) opgeven. Als dit niet is opgegeven, OF als uw donatiestatus niet actueel is, wordt dit veld niet naar PVOutput verzonden.
      ext_v9:
        name: Uitgebreide gegevens v9
        description: Een bron die wordt gebruikt om het v9 uitgebreide veld in PVOutput te vullen. U kunt een sensorklassenaam, een entiteit-ID zonder het voorvoegsel 'sensor.', een direct MQTT-onderwerp (of mqtt:<topic>), of een Home Assistant sensor entiteit-ID (sensor.<id> of ha:sensor.<id>) opgeven. Als dit niet is opgegeven, OF als uw donatiestatus niet actueel is, wordt dit veld niet naar PVOutput verzonden.
      ext_v10:
        name: Uitgebreide gegevens v10
        description: Een bron die wordt gebruikt om het v10 uitgebreide veld in PVOutput te vullen. U kunt een sensorklassenaam, een entiteit-ID zonder het voorvoegsel 'sensor.', een direct MQTT-onderwerp (of mqtt:<topic>), of een Home Assistant sensor entiteit-ID (sensor.<id> of ha:sensor.<id>) opgeven. Als dit niet is opgegeven, OF als uw donatiestatus niet actueel is, wordt dit veld niet naar PVOutput verzonden.
      ext_v11:
        name: Uitgebreide gegevens v11
        description: Een bron die wordt gebruikt om het v11 uitgebreide veld in PVOutput te vullen. U kunt een sensorklassenaam, een entiteit-ID zonder het voorvoegsel 'sensor.', een direct MQTT-onderwerp (of mqtt:<topic>), of een Home Assistant sensor entiteit-ID (sensor.<id> of ha:sensor.<id>) opgeven. Als dit niet is opgegeven, OF als uw donatiestatus niet actueel is, wordt dit veld niet naar PVOutput verzonden.
      ext_v12:
        name: Uitgebreide gegevens v12
        description: Een bron die wordt gebruikt om het v12 uitgebreide veld in PVOutput te vullen. U kunt een sensorklassenaam, een entiteit-ID zonder het voorvoegsel 'sensor.', een direct MQTT-onderwerp (of mqtt:<topic>), of een Home Assistant sensor entiteit-ID (sensor.<id> of ha:sensor.<id>) opgeven. Als dit niet is opgegeven, OF als uw donatiestatus niet actueel is, wordt dit veld niet naar PVOutput verzonden.
      temp_topic:
        name: Temperatuur
        description: Een bron voor de huidige temperatuur die naar PVOutput wordt verzonden. U kunt een direct MQTT-onderwerp (of mqtt:<topic>), of een Home Assistant sensor entiteit-ID (sensor.<id> of ha:sensor.<id>) opgeven. Als dit niet is opgegeven, wordt de temperatuur niet naar PVOutput verzonden.
  mqtt:
    name: MQTT-configuratie
    description: Configuratie voor verbinding met uw MQTT broker. U hoeft dit gedeelte niet te configureren als u de Home Assistant MQTT-app gebruikt.
    fields:
      broker:
        name: Broker adres
        description: Hostnaam of IP-adres van uw MQTT broker.
      port:
        name: MQTT poort
        description: Luisterpoort van de MQTT broker. Standaard 1883, of 8883 met TLS.
      tls:
        name: TLS-communicatie inschakelen
        description: Beveiligde communicatie met de MQTT broker via TLS/SSL inschakelen (als de broker dit ondersteunt).
      username:
        name: Gebruikersnaam
        description: Gebruikersnaam voor de MQTT broker.
      password:
        name: Wachtwoord
        description: Wachtwoord voor de MQTT broker.
  advanced:
    name: Geavanceerde instellingen
    description: Geavanceerde configuratie-instellingen voor sigenergy2mqtt
    fields:
      clean:
        name: MQTT bewaarde berichten opschonen
        description: MQTT bewaarde berichten opschonen om de sigenergy2mqtt MQTT-apparaten in Home Assistant te vernieuwen. **MET VOORZICHTIGHEID GEBRUIKEN!** Alle gedefinieerde Home Assistant helpers die naar sigenergy2mqtt-sensoren verwijzen, worden *verwijderd*!
      consumption_method:
        name: Verbruiksmethode
        description: De methode voor het berekenen van de sensor `Plant Consumed Power`. Op firmware ouder dan de versie die Modbus-protocol V2.8 ondersteunt, is 'Calculated' de enige beschikbare optie en worden alle andere waarden _genegeerd_. Voor V2.8-firmware is de standaardwaarde 'Total Load'.
      read_only:
        name: Alleen-lezen inschakelen
        description: Inschakelen om alleen gegevens van het Sigenergy apparaat te lezen. Uitschakelen om het schrijven van gegevens naar het Sigenergy apparaat toe te staan.
      no_remote_ems:
        name: Remote EMS uitschakelen
        description: Inschakelen om alle lees-/schrijfsensoren te verbergen die worden gebruikt voor de integratie van het remote Energy Management System (EMS). Wordt genegeerd als 'Modbus Read Only' is ingeschakeld.
      no_ems_mode_check:
        name: Remote EMS-controles uitschakelen
        description: Inschakelen om de validatie UIT te zetten die de limieten ESS Max Charging/Discharging en PV Max Power uitschakelt wanneer de Remote EMS-regelmodus niet Command Charging/Discharging is. Wordt genegeerd als 'No Remote EMS' is ingeschakeld. (Geavanceerde instelling - met voorzichtigheid gebruiken)
      edit_pct_box:
        name: Percentage box editor inschakelen
        description: Inschakelen om een numeriek invoerveld te gebruiken om de waarde van percentagesensoren te wijzigen, of uitgeschakeld laten om hiervoor een schuifregelaar te gebruiken.
      sigenergy_local_modbus_naming:
        name: Sigenergy-Local-Modbus Naamgeving
        description: Inschakelen om de TypQxQ/Sigenergy-Local-Modbus entiteitsnaamgevingsconventie voor sensoren te gebruiken. (U moet ook het opschonen van MQTT-berichten inschakelen bij het wijzigen van deze optie, anders worden de nieuwe entiteitsnamen genegeerd door Home Assistant.)
      metrics_enabled:
        name: Metriek inschakelen
        description: De publicatie van sigenergy2mqtt metriek naar Home Assistant inschakelen.
      sanity_check_default_kw:
        name: Standaard kW voor controle
        description: De standaardwaarde in kW die wordt gebruikt voor controles om de maximum- en minimumwaarden van de werkelijke waarde van vermogenssensoren en de deltawaarde van energiesensoren te valideren. De standaardwaarde is 500 kW per seconde, wat betekent dat metingen buiten het bereik ±500 worden genegeerd.
      language:
        name: Taal
        description: De taal die voor sigenergy2mqtt moet worden gebruikt. De standaard is die gedefinieerd in Instellingen → Systeem → Taal, of als die taal niet wordt ondersteund, is de standaard Engels.
      envvars:
        name: Omgevingsvariabelen
        description: Hiermee kunt u geavanceerde omgevingsvariabelen configureren voor de sigenergy2mqtt-service. De volledige lijst met beschikbare omgevingsvariabelen is te vinden op https://github.com/seud0nym/sigenergy2mqtt/blob/main/resources/configuration/ENV.md#environment-variables
        fields:
          name:
            name: Naam
            description: De naam van de omgevingsvariabele.
          value:
            name: Waarde
            description: De waarde van de omgevingsvariabele.
  logging:
    name: Logconfiguratie
    description: Configuratie van logniveaus
    fields:
      sigenergy2mqtt:
        name: sigenergy2mqtt
        description: sigenergy2mqtt logniveau instellen.
      debug_sensor:
        name: Te debuggen sensor
        description: Geef een te debuggen sensor op met de volledige entiteit-ID, een gedeeltelijke entiteit-ID, de volledige sensorklassenaam of een gedeeltelijke sensorklassenaam. U kunt ook reguliere expressies gebruiken. Als u bijvoorbeeld 'daily' opgeeft, worden alle sensoren gevonden met daily in hun entiteitsnaam. Indien opgegeven wordt de sigenergy2mqtt-logging ook geforceerd op DEBUG gezet.
      app:
        name: App uitvoerscript
        description: Het logniveau van het app-uitvoerscript instellen. LET OP! Instellen op ALL, TRACE of DEBUG levert zeer uitgebreide uitvoer op.
      modbus:
        name: Modbus
        description: Het pymodbus logniveau instellen. LET OP! Instellen op DEBUG levert zeer uitgebreide uitvoer op.
      pvoutput:
        name: PVOutput
        description: PVOutput logniveau.
      mqtt:
        name: MQTT
        description: Het paho.mqtt logniveau instellen. LET OP! Instellen op DEBUG levert zeer uitgebreide uitvoer op.
      influxdb:
        name: InfluxDB
        description: Het InfluxDB logniveau instellen. LET OP! Instellen op DEBUG kan zeer uitgebreide uitvoer opleveren.
      cloud:
        name: Cloud
        description: Cloud logniveau instellen. LET OP! Instellen op DEBUG kan zeer uitgebreide uitvoer produceren.
  cloud:
    name: Cloudconfiguratie
    description: Configuratie voor toegang tot de onofficiële Sigenergy mySigen Cloud API om gegevens van uw Sigenergy apparaten op te halen.
    fields:
      region:
        name: Regio
        description: De regio waar uw Sigenergy mySigen-account zich bevindt.
      username:
        name: Gebruikersnaam
        description: Uw Sigenergy Cloud gebruikersnaam. Het wordt sterk aanbevolen een gedelegeerd account met "View and Edit"-toegang aan te maken en te gebruiken in plaats van het primaire mySigen-account, en dit account niet voor andere doeleinden te gebruiken. Zie de documentatie voor instructies voor het aanmaken van een gedelegeerd account.
      password:
        name: Wachtwoord
        description: Uw Sigenergy Cloud wachtwoord.
      accept_unofficial_api_risk:
        name: Risico onofficiële API accepteren
        description: Deze cloudintegratie gebruikt onofficiële mySigen API's die kunnen veranderen en op elk moment door Sigenergy kunnen worden uitgeschakeld. Door deze optie in te schakelen erkent u dat u de risico's van het gebruik van onofficiële API's begrijpt en accepteert u dat deze integratie op elk moment zonder voorafgaande kennisgeving kan stoppen met werken.
      discover_inverters:
        name: Omvormers detecteren
        description: Detectie van omvormers inschakelen. Laat dit meestal uitgeschakeld, omdat de cloud-API op dit moment geen aanvullende informatie biedt ten opzichte van de Modbus-interface.
  influxdb:
    name: InfluxDB-configuratie
    description: Configuratie voor het schrijven van sensorgegevens naar uw InfluxDB-database. (Dit is anders dan de Home Assistant-integratie met InfluxDB, die alleen ingeschakelde sensoren publiceert en geen herhalende gegevens publiceert.)
    fields:
      enabled:
        name: InfluxDB inschakelen
        description: Publicatie van sensorgegevens naar InfluxDB inschakelen.
      host:
        name: Serveradres
        description: Hostnaam of IP-adres van uw InfluxDB-database. Standaard is 'a0d7b954-influxdb' (hostnaam van de InfluxDB Home Assistant app).
      port:
        name: Poort
        description: Luisterpoort van de InfluxDB-database. Standaard is 8086.
      username:
        name: Gebruikersnaam
        description: Geldige gebruikersnaam voor de InfluxDB-database.
      password:
        name: Wachtwoord
        description: Geldig wachtwoord voor de InfluxDB-databasegebruiker.
      database:
        name: Gegevensbank
        description: Naam van de te gebruiken database. Standaard is sigenergy.
      org:
        name: Organisatie
        description: InfluxDB v2 organisatienaam of -ID. Indien niet opgegeven, wordt de v1 API gebruikt.
      token:
        name: Toegangstoken
        description: InfluxDB v2 authenticatietoken. Indien opgegeven, worden v2 API's bij voorkeur gebruikt.
      bucket:
        name: Opslagemmer
        description: InfluxDB v2 bucketnaam. Indien niet opgegeven, wordt de waarde van 'database' als v2 bucketnaam gebruikt.
      include:
        name: Opnemen
        description: Lijst van sensoren om op te nemen bij publicatie naar InfluxDB, met volledige of gedeeltelijke entiteit-ID, sensorklassenaam of een reguliere expressie. Indien niet opgegeven, worden alle sensoren opgenomen.
        fields:
          sensor:
            name: Meetvoeler
            description: De sensor om op te nemen bij publicatie naar InfluxDB.
      exclude:
        name: Uitsluiten
        description: Lijst van sensoren om uit te sluiten bij publicatie naar InfluxDB, met volledige of gedeeltelijke entiteit-ID, sensorklassenaam of een reguliere expressie. Indien niet opgegeven, worden geen sensoren uitgesloten.
        fields:
          sensor:
            name: Meetvoeler
            description: De sensor om uit te sluiten bij publicatie naar InfluxDB.
