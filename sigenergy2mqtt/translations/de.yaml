configuration:
  auto_discovery:
    name: Sigenergy Geräte-Auto-Erkennung
    description: Konfiguration zur automatischen Erkennung Ihrer Sigenergy-Geräte
    fields:
      status:
        name: Status
        description: Steuert die automatische Erkennung von Sigenergy-Modbus-Hosts und zugehörigen Geräte-IDs. Sie müssen nur `Forced` auswählen, wenn Sie zuvor Hosts/Geräte-IDs automatisch erkannt haben und sich Ihr Netzwerk oder Ihre Geräte geändert haben.
      max_device_id:
        name: Max. Geräte-ID
        description: Die maximale Geräte-ID, die bei der automatischen Erkennung von Sigenergy-Geräten im Netzwerk verwendet wird. Der Standardwert ist `10` und muss zwischen 1 und 246 (einschließlich) liegen. Diese Option kann die automatische Erkennung erheblich beschleunigen, birgt jedoch das Risiko, Geräte nicht zu finden, die mit einer höheren Geräte-ID konfiguriert wurden, als durch diese Einstellung zulässig ist.
      ping_timeout:
        name: Ping-Zeitüberschreitung
        description: Die Ping-Zeitüberschreitung in Sekunden bei der Auto-Erkennung. Standard ist 0,5 Sekunden.
      retries:
        name: Maximale Wiederholungen
        description: Die maximale Anzahl von Wiederholungen bei der Auto-Erkennung. Standard ist 0.
      timeout:
        name: Modbus-Zeitüberschreitung
        description: Die Modbus-Zeitüberschreitung in Sekunden bei der Auto-Erkennung. Standard ist 0,25 Sekunden.
  manual_config:
    name: Manuelle Sigenergy-Gerätekonfiguration
    description: Konfiguration zur manuellen Angabe Ihrer Sigenergy-Geräteverbindungsdetails
    fields:
      host:
        name: Host-Adresse
        description: Der Hostname oder die IP-Adresse des Sigenergy-Geräts. Leer lassen für Auto-Erkennung.
      port:
        name: Modbus-Port
        description: Die Modbus-Portnummer des Sigenergy-Geräts.
      inverter_device_id:
        name: Wechselrichter-Geräte-ID
        description: Die Sigenergy Wechselrichter Modbus-Geräte-ID. Bei mehreren Wechselrichtern können Sie eine durch Leerzeichen getrennte Liste von IDs angeben. Wird ignoriert, wenn kein Modbus-Host angegeben ist; in diesem Fall kann die Auto-Erkennung die Wechselrichter-Geräte identifizieren.
      accharger_device_id:
        name: AC-Ladegerät-Geräte-ID
        description: Die Sigenergy AC-Ladegerät Modbus-Geräte-ID. Wird ignoriert, wenn kein Modbus-Host angegeben ist; in diesem Fall kann die Auto-Erkennung die AC-Ladegeräte identifizieren.
      dccharger_device_id:
        name: DC-Ladegerät-Geräte-ID
        description: Die Sigenergy DC-Ladegerät Modbus-Geräte-ID (normalerweise identisch mit der Wechselrichter-Geräte-ID). Wird ignoriert, wenn kein Modbus-Host angegeben ist; in diesem Fall kann die Auto-Erkennung die DC-Ladegeräte identifizieren.
  scan_interval:
    name: Sensor-Abtastintervalle
    description: Konfiguration der Abtastintervalle für verschiedene Sensorklassen
    fields:
      low:
        name: Niedrige Frequenz
        description: Abtastintervall in Sekunden für Sensoren mit niedriger Frequenz. Standard 600, Minimum 1.
      medium:
        name: Mittlere Frequenz
        description: Abtastintervall in Sekunden für Sensoren mit mittlerer Frequenz. Standard 60, Minimum 1.
      high:
        name: Hohe Frequenz
        description: Abtastintervall in Sekunden für Sensoren mit hoher Frequenz. Standard 10, Minimum 1.
      realtime:
        name: Nahezu Echtzeit
        description: Abtastintervall in Sekunden für Echtzeit-Sensoren. Standard 5, Minimum 1.
      cloud:
        name: Cloud-Frequenz
        description: Abtastintervall in Sekunden für den Abruf von Cloud-Daten. Standard 5, Minimum 1.
  pvoutput:
    name: PVOutput.org-Integration
    description: Konfiguration zur Integration mit PVOutput.org, um Erzeugungs- und Verbrauchsdaten hochzuladen
    fields:
      enabled:
        name: Hochladen aktivieren
        description: Status-Updates für PVOutput aktivieren.
      api_key:
        name: API-Schlüssel
        description: Der API-Schlüssel für PVOutput
      system_id:
        name: System-ID
        description: Die PVOutput System-ID
      consumption:
        name: Verbrauchs-Uploads aktivieren
        description: Verbrauchsstatus an PVOutput senden.
      exports:
        name: Export-Uploads aktivieren
        description: Exportdaten an PVOutput senden.
      imports:
        name: Import-Uploads aktivieren
        description: Importdaten an PVOutput senden.
      eod_update:
        name: Tagesend-Upload aktivieren
        description: Wenn aktiviert, werden die Spitzenerzeugung und die Tagessummen für Exporte und Importe (falls aktiviert) am Tagesende an PVOutput gesendet. Wenn deaktiviert, werden diese Werte nach dem gleichen Zeitplan wie die Status-Updates hochgeladen.
      voltage:
        name: Spannungsquelle
        description: Quelle des Spannungswerts, der an PVOutput gesendet wird. Verwenden Sie 'Phase A' für Einphasensysteme, 'Phase B', 'Phase C' oder 'Line to Line Average' für Dreiphasensysteme oder 'Line to Neutral Average' oder 'PV Average' für beide.
      ext_v7:
        name: Erweiterte Daten v7
        description: Eine Quelle, die zum Ausfüllen des erweiterten Felds v7 in PVOutput verwendet wird. Sie können einen Sensorklassennamen, eine Entitäts-ID ohne das Präfix 'sensor.', ein direktes MQTT-Topic (oder mqtt:<topic>) oder eine Home Assistant Sensor-Entitäts-ID (sensor.<id> oder ha:sensor.<id>) angeben. Wenn nicht angegeben, ODER wenn Ihr Spendenstatus nicht aktuell ist, wird dieses Feld nicht an PVOutput gesendet.
      ext_v8:
        name: Erweiterte Daten v8
        description: Eine Quelle, die zum Ausfüllen des erweiterten Felds v8 in PVOutput verwendet wird. Sie können einen Sensorklassennamen, eine Entitäts-ID ohne das Präfix 'sensor.', ein direktes MQTT-Topic (oder mqtt:<topic>) oder eine Home Assistant Sensor-Entitäts-ID (sensor.<id> oder ha:sensor.<id>) angeben. Wenn nicht angegeben, ODER wenn Ihr Spendenstatus nicht aktuell ist, wird dieses Feld nicht an PVOutput gesendet.
      ext_v9:
        name: Erweiterte Daten v9
        description: Eine Quelle, die zum Ausfüllen des erweiterten Felds v9 in PVOutput verwendet wird. Sie können einen Sensorklassennamen, eine Entitäts-ID ohne das Präfix 'sensor.', ein direktes MQTT-Topic (oder mqtt:<topic>) oder eine Home Assistant Sensor-Entitäts-ID (sensor.<id> oder ha:sensor.<id>) angeben. Wenn nicht angegeben, ODER wenn Ihr Spendenstatus nicht aktuell ist, wird dieses Feld nicht an PVOutput gesendet.
      ext_v10:
        name: Erweiterte Daten v10
        description: Eine Quelle, die zum Ausfüllen des erweiterten Felds v10 in PVOutput verwendet wird. Sie können einen Sensorklassennamen, eine Entitäts-ID ohne das Präfix 'sensor.', ein direktes MQTT-Topic (oder mqtt:<topic>) oder eine Home Assistant Sensor-Entitäts-ID (sensor.<id> oder ha:sensor.<id>) angeben. Wenn nicht angegeben, ODER wenn Ihr Spendenstatus nicht aktuell ist, wird dieses Feld nicht an PVOutput gesendet.
      ext_v11:
        name: Erweiterte Daten v11
        description: Eine Quelle, die zum Ausfüllen des erweiterten Felds v11 in PVOutput verwendet wird. Sie können einen Sensorklassennamen, eine Entitäts-ID ohne das Präfix 'sensor.', ein direktes MQTT-Topic (oder mqtt:<topic>) oder eine Home Assistant Sensor-Entitäts-ID (sensor.<id> oder ha:sensor.<id>) angeben. Wenn nicht angegeben, ODER wenn Ihr Spendenstatus nicht aktuell ist, wird dieses Feld nicht an PVOutput gesendet.
      ext_v12:
        name: Erweiterte Daten v12
        description: Eine Quelle, die zum Ausfüllen des erweiterten Felds v12 in PVOutput verwendet wird. Sie können einen Sensorklassennamen, eine Entitäts-ID ohne das Präfix 'sensor.', ein direktes MQTT-Topic (oder mqtt:<topic>) oder eine Home Assistant Sensor-Entitäts-ID (sensor.<id> oder ha:sensor.<id>) angeben. Wenn nicht angegeben, ODER wenn Ihr Spendenstatus nicht aktuell ist, wird dieses Feld nicht an PVOutput gesendet.
      temp_topic:
        name: Temperatur
        description: Eine Quelle für die aktuelle Temperatur, die an PVOutput gesendet wird. Sie können ein direktes MQTT-Topic (oder mqtt:<topic>) oder eine Home Assistant Sensor-Entitäts-ID (sensor.<id> oder ha:sensor.<id>) angeben. Wenn nicht angegeben, wird die Temperatur nicht an PVOutput gesendet.
  mqtt:
    name: MQTT-Konfiguration
    description: Konfiguration zur Verbindung mit Ihrem MQTT-Broker. Sie müssen diesen Abschnitt nicht konfigurieren, wenn Sie die Home Assistant MQTT-App verwenden.
    fields:
      broker:
        name: Broker-Adresse
        description: Hostname oder IP-Adresse Ihres MQTT-Brokers.
      port:
        name: MQTT-Port
        description: Listening-Port des MQTT-Brokers. Standard 1883, oder 8883 bei TLS.
      tls:
        name: TLS-Kommunikation aktivieren
        description: Sichere Kommunikation mit dem MQTT-Broker über TLS/SSL aktivieren (sofern der Broker dies unterstützt).
      username:
        name: Benutzername
        description: Benutzername für den MQTT-Broker.
      password:
        name: Passwort
        description: Passwort für den MQTT-Broker.
  advanced:
    name: Erweiterte Einstellungen
    description: Erweiterte Konfigurationseinstellungen für sigenergy2mqtt
    fields:
      clean:
        name: MQTT Retained Messages bereinigen
        description: MQTT Retained Messages bereinigen, um die MQTT-Geräte von sigenergy2mqtt in Home Assistant zu aktualisieren. **MIT VORSICHT VERWENDEN!** Alle definierten Home Assistant-Helfer, die auf sigenergy2mqtt-Sensoren verweisen, werden *entfernt*!
      consumption_method:
        name: Verbrauchsmethode
        description: Die Methode zur Berechnung des Sensors `Plant Consumed Power`. Bei Firmware, die älter ist als die Version mit Unterstützung für Modbus-Protokoll V2.8, ist 'Calculated' die einzige verfügbare Option, und alle anderen Werte werden _ignoriert_. Bei V2.8-Firmware ist der Standard 'Total Load'.
      read_only:
        name: Nur-Lesen aktivieren
        description: Aktivieren, um nur Daten vom Sigenergy-Gerät zu lesen. Deaktivieren, um das Schreiben von Daten auf das Sigenergy-Gerät zu erlauben.
      no_remote_ems:
        name: Remote-EMS deaktivieren
        description: Aktivieren, um alle Lese-/Schreibsensoren auszublenden, die für die Integration des Remote-Energiemanagementsystems (EMS) verwendet werden. Wird ignoriert, wenn 'Modbus Read Only' aktiviert ist.
      no_ems_mode_check:
        name: Remote-EMS-Prüfungen deaktivieren
        description: Aktivieren, um die Validierung ABZUSCHALTEN, die die Grenzwerte für ESS Max Charging/Discharging und PV Max Power deaktiviert, wenn der Remote-EMS-Steuermodus nicht Command Charging/Discharging ist. Wird ignoriert, wenn 'No Remote EMS' aktiviert ist. (Erweiterte Einstellung - mit Vorsicht verwenden)
      edit_pct_box:
        name: Prozent-Box-Editor aktivieren
        description: Aktivieren, um den Wert von Prozentsensoren über ein numerisches Eingabefeld zu ändern, oder deaktiviert lassen, um dafür einen Schieberegler zu verwenden.
      sigenergy_local_modbus_naming:
        name: Sigenergy-Local-Modbus Benennung
        description: Aktivieren, um die TypQxQ/Sigenergy-Local-Modbus-Entitätsbenennungskonvention für Sensoren zu verwenden. (Sie sollten auch die Bereinigung von MQTT-Nachrichten aktivieren, wenn Sie diese Option ändern, da andernfalls die neuen Entitätsnamen von Home Assistant ignoriert werden.)
      metrics_enabled:
        name: Metriken aktivieren
        description: Veröffentlichung der sigenergy2mqtt-Metriken in Home Assistant aktivieren.
      sanity_check_default_kw:
        name: Standard-kW für Plausibilitätsprüfung
        description: Der Standardwert in kW für Plausibilitätsprüfungen, mit denen die Maximal- und Minimalwerte für den tatsächlichen Wert von Leistungssensoren und den Delta-Wert von Energiesensoren validiert werden. Der Standardwert beträgt 500 kW pro Sekunde, d. h. Messwerte außerhalb des Bereichs ±500 werden ignoriert.
      language:
        name: Sprache
        description: Die für sigenergy2mqtt zu verwendende Sprache. Der Standardwert ist die in Einstellungen → System → Sprache definierte Sprache. Wenn diese Sprache nicht unterstützt wird, ist der Standardwert Englisch.
      envvars:
        name: Umgebungsvariablen
        description: Ermöglicht die Konfiguration erweiterter Umgebungsvariablen für den sigenergy2mqtt-Dienst. Die vollständige Liste der verfügbaren Umgebungsvariablen finden Sie unter https://github.com/seud0nym/sigenergy2mqtt/blob/main/resources/configuration/ENV.md#environment-variables
        fields:
          name:
            name: Name
            description: Der Name der Umgebungsvariablen.
          value:
            name: Wert
            description: Der Wert der Umgebungsvariablen.
  logging:
    name: Protokollierungskonfiguration
    description: Konfiguration der Protokollierungsstufen
    fields:
      sigenergy2mqtt:
        name: sigenergy2mqtt
        description: sigenergy2mqtt-Protokollierungsstufe festlegen.
      debug_sensor:
        name: Zu debuggender Sensor
        description: Geben Sie einen zu debuggenden Sensor an, entweder mit der vollständigen Entitäts-ID, einer teilweisen Entitäts-ID, dem vollständigen Sensorklassennamen oder einem teilweisen Sensorklassennamen. Sie können auch reguläre Ausdrücke verwenden. Wenn Sie beispielsweise 'daily' angeben, werden alle Sensoren gefunden, deren Entitätsname 'daily' enthält. Wenn angegeben, wird die sigenergy2mqtt-Protokollierung ebenfalls auf DEBUG gesetzt.
      app:
        name: App-Ausführungsskript
        description: Protokollierungsstufe des App-Ausführungsskripts festlegen. WARNUNG! Die Einstellung ALL, TRACE oder DEBUG erzeugt sehr ausführliche Ausgaben.
      modbus:
        name: Modbus
        description: pymodbus-Protokollierungsstufe festlegen. WARNUNG! Die Einstellung DEBUG erzeugt sehr ausführliche Ausgaben.
      pvoutput:
        name: PVOutput
        description: PVOutput-Protokollierungsstufe.
      mqtt:
        name: MQTT
        description: paho.mqtt-Protokollierungsstufe festlegen. WARNUNG! Die Einstellung DEBUG erzeugt sehr ausführliche Ausgaben.
      influxdb:
        name: InfluxDB
        description: InfluxDB-Protokollierungsstufe festlegen. WARNUNG! Die Einstellung DEBUG kann sehr ausführliche Ausgaben erzeugen.
      cloud:
        name: Cloud
        description: Cloud-Protokollierungsstufe festlegen. WARNUNG! Die Einstellung DEBUG kann sehr ausführliche Ausgaben erzeugen.
  cloud:
    name: Cloud-Konfiguration
    description: Konfiguration für den Zugriff auf die inoffizielle Sigenergy mySigen Cloud-API zum Abrufen von Daten Ihrer Sigenergy-Geräte.
    fields:
      region:
        name: Region
        description: Die Region, in der sich Ihr Sigenergy mySigen-Konto befindet.
      username:
        name: Benutzername
        description: Ihr Sigenergy Cloud-Benutzername. Es wird dringend empfohlen, anstelle des primären mySigen-Kontos ein delegiertes Konto mit dem Zugriff "View and Edit" zu erstellen und zu verwenden und dieses Konto für keinen anderen Zweck zu nutzen. Anweisungen zum Erstellen eines delegierten Kontos finden Sie in der Dokumentation.
      password:
        name: Passwort
        description: Ihr Sigenergy Cloud-Passwort.
      accept_unofficial_api_risk:
        name: Risiko der inoffiziellen API akzeptieren
        description: Diese Cloud-Integration verwendet inoffizielle mySigen-APIs, die sich ändern können und von Sigenergy jederzeit deaktiviert werden können. Durch Aktivieren dieser Option bestätigen Sie, dass Sie die Risiken der Verwendung inoffizieller APIs verstehen und akzeptieren, dass diese Integration jederzeit ohne Vorankündigung nicht mehr funktionieren kann.
      discover_inverters:
        name: Wechselrichter erkennen
        description: Erkennung von Wechselrichtern aktivieren. In der Regel deaktiviert lassen, da die Cloud-API derzeit keine zusätzlichen Informationen zu denen der Modbus-Schnittstelle liefert.
  influxdb:
    name: InfluxDB-Konfiguration
    description: Konfiguration zum Schreiben von Sensordaten in Ihre InfluxDB-Datenbank. (Dies unterscheidet sich von der Home Assistant-Integration mit InfluxDB, die nur aktivierte Sensoren veröffentlicht und keine wiederholenden Daten sendet.)
    fields:
      enabled:
        name: InfluxDB aktivieren
        description: Veröffentlichung von Sensordaten an InfluxDB aktivieren.
      host:
        name: Hostadresse
        description: Hostname oder IP-Adresse Ihrer InfluxDB-Datenbank. Standard ist 'a0d7b954-influxdb' (Hostname des InfluxDB Home Assistant Apps).
      port:
        name: Anschluss
        description: Listening-Port der InfluxDB-Datenbank. Standard ist 8086.
      username:
        name: Benutzername
        description: Gültiger Benutzername für die InfluxDB-Datenbank.
      password:
        name: Passwort
        description: Gültiges Passwort für den InfluxDB-Datenbankbenutzer.
      database:
        name: Datenbank
        description: Name der zu verwendenden Datenbank. Standard ist sigenergy.
      org:
        name: Organisation
        description: InfluxDB v2 Organisationsname oder -ID. Wenn nicht angegeben, wird die v1 API verwendet.
      token:
        name: Zugriffstoken
        description: InfluxDB v2 Authentifizierungstoken. Wenn angegeben, werden v2 APIs bevorzugt verwendet.
      bucket:
        name: Speicher-Bucket
        description: InfluxDB v2 Bucket-Name. Wenn nicht angegeben, wird der Wert von 'database' als v2 Bucket-Name verwendet.
      include:
        name: Einschließen
        description: Liste der Sensoren, die bei der Veröffentlichung an InfluxDB eingeschlossen werden sollen, unter Verwendung der vollständigen oder teilweisen Entitäts-ID oder des Sensorklassennamens oder eines regulären Ausdrucks. Wenn nicht angegeben, werden alle Sensoren eingeschlossen.
        fields:
          sensor:
            name: Messfühler
            description: Der bei der Veröffentlichung an InfluxDB einzuschließende Sensor.
      exclude:
        name: Ausschließen
        description: Liste der Sensoren, die bei der Veröffentlichung an InfluxDB ausgeschlossen werden sollen, unter Verwendung der vollständigen oder teilweisen Entitäts-ID oder des Sensorklassennamens oder eines regulären Ausdrucks. Wenn nicht angegeben, werden keine Sensoren ausgeschlossen.
        fields:
          sensor:
            name: Messfühler
            description: Der bei der Veröffentlichung an InfluxDB auszuschließende Sensor.
